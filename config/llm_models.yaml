# LLM models configuration
# One llama.cpp server (`llama serve`) is started per model.
#
# server_args: literal `llama serve` flags for this model, merged over llm_server_args in config.yaml.
#   true gives a bare flag, false/null omits it, anything else gives `flag value`.
#   - Paths: -m (the model), --mmproj (the vision projector; images need it)
#   - A model's value wins over llm_server_args; `false` drops a global flag (e.g. -fitt: false)
#
# generation_options: request fields (OpenAI names), merged between llm_generation_defaults in config.yaml
#   and each prompt's options.
#   - Here: the recommended sampling. Source: the card of the repo the file came from, when it gives settings for this
#     build; else the card of the model's original authors; where the repo's card only excerpts the authors' (Qwen3.5),
#     the authors' full set. Each entry says which. A model with no recommendation anywhere has no generation_options:
#     llama.cpp's own defaults apply (or the ones its GGUF carries) and the results record what was used (`sampling`).
#   - Other fields: max_tokens (-1: no limit), seed, chat_template_kwargs, reasoning_effort, ...
#   - Card names become llama.cpp's: repetition_penalty is repeat_penalty.
#   - The Qwen cards give one set for thinking mode (the default) and another for non-thinking; these entries use the
#     thinking-mode one for general tasks. Thinking is switched off with chat_template_kwargs: {enable_thinking: false}
#     (or reasoning_effort: none) and capped with the server flag `--reasoning-budget: 1500`. For the Qwens the
#     non-thinking set is temperature 0.7, top_p 0.8, top_k 20, min_p 0, presence_penalty 1.5.
#   - Models that think put it in `reasoning` in the results. Near-greedy sampling (temperature 0.2) made Qwen3.5-4B
#     loop in its thinking until max_tokens ran out ("Write a modern version of Little Red Riding Hood" repeated one line
#     510 times); more tokens do not help, the card's sampling does.
#   - Ollama's num_predict, num_ctx, ... are refused: llama-server would ignore them without a word.
#
# Order: by model family, oldest first; inside a family by size, then variant.
# The MTP draft files (mtp-gemma-4-*, *-FastMTP-32K) for speculative decoding are not used yet.
# Each card ends with the source URL(s).

# Mistral Nemo Instruct 2407, 12B, text only. Q4_K_M, 7.5 GB.
# Sampling: temperature 0.3 (Mistral's card: "Mistral Nemo requires smaller temperatures"; the repo's card gives none).
# https://huggingface.co/bartowski/Mistral-Nemo-Instruct-2407-GGUF
- name: mistral-nemo-12b
  server_args:
    -m: /home/shared/ai/llm/Mistral-Nemo-Instruct-2407-Q4_K_M.gguf
  generation_options:
    temperature: 0.3

# JoyCaption Beta One: image captioning (Llama 3.1 8B with a SigLIP2 vision tower). Q4_K_M, 4.9 GB; needs its mmproj.
# The model repo has no mmproj; it comes from the second repo (F16 only).
# Sampling: temperature 0.6, top_p 0.9 (the author's card, in its example code; the repos' cards give none). The card also uses the system prompt
# "You are a helpful image captioner." and the user prompt "Write a long descriptive caption for this image in a formal tone."
# https://huggingface.co/mradermacher/llama-joycaption-beta-one-hf-llava-GGUF
# https://huggingface.co/concedo/llama-joycaption-beta-one-hf-llava-mmproj-gguf
- name: joycaption-beta-one
  server_args:
    -m: /home/shared/ai/vlm/llama-joycaption-beta-one-hf-llava.Q4_K_M.gguf
    --mmproj: /home/shared/ai/vlm/llama-joycaption-beta-one-llava-mmproj-model-f16.gguf
  generation_options:
    temperature: 0.6
    top_p: 0.9

# Dolphin Mistral 24B Venice Edition (cognitivecomputations), uncensored. IQ4_XS, 12.8 GB.
# Sampling: temperature 0.15 (the author's card, which also asks for a system prompt; the repo's card gives none).
# https://huggingface.co/bartowski/cognitivecomputations_Dolphin-Mistral-24B-Venice-Edition-GGUF
- name: dolphin-venice-24b
  server_args:
    -m: /home/shared/ai/llm/cognitivecomputations_Dolphin-Mistral-24B-Venice-Edition-IQ4_XS.gguf
  generation_options:
    temperature: 0.15

# Cydonia 24B v4zg (TheDrummer). Q4_K_M, 14.3 GB: with the context on top it does not fit 16 GB, so --fit
