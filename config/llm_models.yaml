# Sampling: none recommended (TheDrummer's card is the repo's), so llama.cpp's defaults apply.
# https://huggingface.co/TheDrummer/Cydonia-24B-v4.3-GGUF
- name: cydonia-24b-v4zg
  server_args:
    -m: /home/shared/ai/llm/Cydonia-24B-v4zg-Q4_K_M.gguf

# Qwen2.5-VL 7B fine-tuned for NSFW image captions, V4. Q4_K_M, 4.7 GB; needs its mmproj, and only the repo's own fits
# (the official Qwen2.5-VL one does not: this model is 4096 wide, the stock one 3584). It uses the repo's Q8_0 mmproj: the
# repo's F16 one made every image answer "??????..." on the GPU (and works only with --no-mmproj-offload, vision on the CPU,
# 12 s for the first image against 1 s). The other models' F16 projectors are fine.
# Sampling: none found (the repo's card gives none, the author's needs a login, the base Qwen2.5-VL card gives none), so
# llama.cpp's defaults apply.
# https://huggingface.co/mradermacher/Qwen2.5-VL-7B-NSFW-Caption-V4-GGUF
- name: qwen2.5-vl-7b-nsfw-caption-v4
  server_args:
    -m: /home/shared/ai/vlm/Qwen2.5-VL-7B-NSFW-Caption-V4.Q4_K_M.gguf
    --mmproj: /home/shared/ai/vlm/Qwen2.5-VL-7B-NSFW-Caption-V4.mmproj-Q8_0.gguf

# Qwen3-VL 8B fine-tuned for NSFW image captions, V4.5. Q4_K_M, 5.0 GB; needs its mmproj (F16).
# Sampling: the repo's card gives none, the fine-tune's says it is used like Qwen3-VL-8B-Instruct, so Qwen's card for that
# model, vision tasks: temperature 0.7, top_p 0.8, top_k 20, presence_penalty 1.5, repetition_penalty 1.0.
# https://huggingface.co/mradermacher/Qwen3-VL-8B-NSFW-Caption-V4.5-GGUF
- name: qwen3-vl-8b-nsfw-caption-v4.5
  server_args:
    -m: /home/shared/ai/vlm/Qwen3-VL-8B-NSFW-Caption-V4.5.Q4_K_M.gguf
    --mmproj: /home/shared/ai/vlm/Qwen3-VL-8B-NSFW-Caption-V4.5.mmproj-f16.gguf
  generation_options:
    temperature: 0.7
    top_p: 0.8
    top_k: 20
    presence_penalty: 1.5
    repeat_penalty: 1.0

