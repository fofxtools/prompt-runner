    --model: /home/shared/ai/diffusion/checkpoints/Juggernaut_RunDiffusionPhoto2_Lightning_4Steps.safetensors
  generation_options:
    sample_params: {sample_method: dpm++2m_sde, scheduler: karras, sample_steps: 6, guidance: {txt_cfg: 1.8}}

