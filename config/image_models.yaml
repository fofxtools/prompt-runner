# FLUX.2 dev (32B, Unsloth Q4_K_M GGUF) with the Mistral-Small-3.2-24B text encoder. 32GB of weights on a 16GB card:
# only works through sd.cpp's auto-fit (streams weights from disk, ~80s per 512x512 image at 20 steps). Same FLUX.2 VAE as Klein.
# https://huggingface.co/unsloth/FLUX.2-dev-GGUF
- name: flux2-dev-Q4_K_M
  server_args:
    --diffusion-model: /home/shared/ai/diffusion/gguf/flux2-dev-Q4_K_M.gguf
    --llm: /home/shared/ai/text_encoders/Mistral-Small-3.2-24B-Instruct-2506-Q4_K_M.gguf
    --vae: /home/shared/ai/vae/flux2-vae.safetensors
  generation_options:
    sample_params: {sample_steps: 20, guidance: {txt_cfg: 1.0}}

# FLUX.2 dev + the fal Turbo LoRA (8-step distillation; FLUX dev non-commercial license). Same server as flux2-dev-Q4_K_M.
# 8 steps with the card's pre-shifted sigmas (plus the final 0) and guidance 2.5; ~110s vs ~205s per 1024x1024 image.
# Use the ComfyUI file (comfy/Flux_2-Turbo-LoRA_comfyui.safetensors, linked below): sd.cpp applies all 340 of its tensors, but only
# 134 of the 340 in the diffusers-format flux.2-turbo-lora.safetensors (the images come out blurry and unfinished).
# https://huggingface.co/fal/FLUX.2-dev-Turbo/tree/main/comfy
- name: flux2-dev-Q4_K_M-Turbo
  server_args:
    --diffusion-model: /home/shared/ai/diffusion/gguf/flux2-dev-Q4_K_M.gguf
    --llm: /home/shared/ai/text_encoders/Mistral-Small-3.2-24B-Instruct-2506-Q4_K_M.gguf
    --vae: /home/shared/ai/vae/flux2-vae.safetensors
  generation_options:
    lora: [{path: Flux_2-Turbo-LoRA_comfyui.safetensors, multiplier: 1.0}]
    sample_params:
      guidance: {txt_cfg: 1.0, distilled_guidance: 2.5}
      custom_sigmas: [1.0, 0.6509, 0.4374, 0.2932, 0.1893, 0.1108, 0.0495, 0.00031, 0.0]
