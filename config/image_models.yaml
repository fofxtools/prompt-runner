# FLUX.2 Klein 9B, PornMaster NSFW finetune, Turbo-distilled (4 steps).
# diffusion_model_path is a patched copy (scripts/patch_gguf_head_dim.py) - the
# original community GGUF uses ".weight" suffix on attention norm-scale tensors
# where stable-diffusion.cpp expects ".scale"; unpatched, this SIGFPEs on load.
# See docs/dev-notes.md.
- name: PornMaster_Flux2Klein_v4_Turbo_Q5_K
  init_options:
    diffusion_model_path: /home/shared/ai/diffusion/gguf/PornMaster_Flux2Klein_v4_Turbo_Q5_K.sdcpp-patched.gguf
    llm_path: /home/shared/ai/text_encoders/flux2-klein-9b-uncensored-q4_k_m.gguf
    vae_path: /home/shared/ai/vae/flux2-vae.safetensors
    lora_model_dir: /home/shared/ai/lora
    keep_vae_on_cpu: true
  generation_options:
    cfg_scale: 1.0
    sample_steps: 4
    guidance: 3.5

# FLUX.2 Klein 9B, SNOFS merged directly into the weights rather than applied
# as a LoRA. Converted from the original fp8 safetensors (which
# stable-diffusion.cpp upconverts to F16 at load - 17.3GB, bigger than a
# 16GB card's entire VRAM) to Q5_K GGUF via stable_diffusion_cpp.sd_cpp.convert().
# Already uses correct native tensor naming (the tool's own converter, unlike
# community GGUF conversions - see PornMaster_Flux2Klein_v4_Turbo_Q5_K above).
- name: snofsSexNudesAndOther_v14Klein9bDistilled_full_Q5_K
  init_options:
    diffusion_model_path: /home/shared/ai/diffusion/checkpoints/snofsSexNudesAndOther_v14Klein9bDistilled_full_Q5_K.gguf
    llm_path: /home/shared/ai/text_encoders/flux2-klein-9b-uncensored-q4_k_m.gguf
    vae_path: /home/shared/ai/vae/flux2-vae.safetensors
    keep_vae_on_cpu: true
  generation_options:
    cfg_scale: 1.0
    sample_steps: 4
    guidance: 3.5

# Qwen-Image-2.1. Text encoder must be Qwen3-VL-8B (not plain Qwen3-4B, that's
# for Klein).
# Requires stable-diffusion.cpp's Qwen-Image-2.1 support, added upstream after
# the current stable-diffusion-cpp-python 0.4.7 release. Not usable yet.
- name: qwen-image-2.1-Q4_K_M
  init_options:
    diffusion_model_path: /home/shared/ai/diffusion/gguf/qwen-image-2.1-Q4_K_M.gguf
    llm_path: /home/shared/ai/text_encoders/Qwen3-VL-8B-Instruct-UD-Q4_K_XL.gguf
    vae_path: /home/shared/ai/vae/qwen_image_2.1_vae_bf16.safetensors
    lora_model_dir: /home/shared/ai/lora
    keep_vae_on_cpu: true
  generation_options:
    cfg_scale: 1.0
    sample_steps: 25

# offload_params_to_cpu is required, not optional: text encoder (7.1GB) +
# diffusion model (9.3GB) exceeds a 16GB card's VRAM regardless of image
# resolution. vae_path must be the native/ComfyUI-split-format file
# (qwen_image_vae.safetensors) - the diffusers-format VAE also in vae/
# (Qwen2.5-VL-7B-Instruct-diffusion_pytorch_model.safetensors) uses a
# different tensor naming convention and fails to load. Needs ref_images=[...]
# in generate_image() since this is an image-editing model, not txt2img.
- name: Qwen-Image-Edit-2509-Q3_K_M
  init_options:
    diffusion_model_path: /home/shared/ai/diffusion/gguf/Qwen-Image-Edit-2509-Q3_K_M.gguf
    llm_path: /home/shared/ai/text_encoders/Qwen2.5-VL-7B-Instruct-Q4_K_M.gguf
    llm_vision_path: /home/shared/ai/text_encoders/Qwen2.5-VL-7B-Instruct-mmproj-F16.gguf
    vae_path: /home/shared/ai/vae/qwen_image_vae.safetensors
    lora_model_dir: /home/shared/ai/lora
    offload_params_to_cpu: true
  generation_options:
    cfg_scale: 2.5
    sample_steps: 20
