    sample_params: {sample_steps: 20, guidance: {txt_cfg: 2.5}}

# Qwen-Image-Edit-2511 + the lightx2v Lightning LoRA (4 steps, no CFG, flow shift 3). Same server as Qwen-Image-Edit-2511-Q4_K_M.
# Use the bf16 LoRA file.
