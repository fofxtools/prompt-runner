# Qwen-Image 2.1 (best one-shot renderer for long in-image text). cfg 4.0, 40 steps (the Qwen card's value; at 25 steps paragraph text
# was much worse), ~65s per image at 1024x1024.
# https://huggingface.co/unsloth/Qwen-Image-2.1-GGUF
- name: qwen-image-2.1-Q6_K_XL
  server_args:
    --diffusion-model: /home/shared/ai/diffusion/gguf/qwen-image-2.1-Q6_K_XL.gguf
    --llm: /home/shared/ai/text_encoders/Qwen3-VL-8B-Instruct-UD-Q4_K_XL.gguf
    --vae: /home/shared/ai/vae/qwen_image_2.1_vae_bf16.safetensors
  generation_options:
    sample_params: {sample_steps: 40, guidance: {txt_cfg: 4.0}}

# Qwen-Image 2.1 Turbo (Qwen's official 8-step distillation; Qwen Research License, non-commercial). 8 steps, cfg 1.0, euler, the
# fixed sigma schedule (same as sd-cli `--sigmas qwen-image-2.1-turbo`). ~8s per image at 1024x1024, about 8x faster than the entry
# above with similar paragraph-text quality in a blind test.
# https://huggingface.co/unsloth/Qwen-Image-2.1-Turbo-GGUF
- name: qwen-image-2.1-turbo-Q6_K_XL
  server_args:
    --diffusion-model: /home/shared/ai/diffusion/gguf/qwen-image-2.1-turbo-Q6_K_XL.gguf
    --llm: /home/shared/ai/text_encoders/Qwen3-VL-8B-Instruct-UD-Q4_K_XL.gguf
    --vae: /home/shared/ai/vae/qwen_image_2.1_vae_bf16.safetensors
  generation_options:
    sample_params:
      sample_method: euler
      guidance: {txt_cfg: 1.0}
      custom_sigmas: [1.0, 0.978453, 0.95418, 0.926626, 0.89508, 0.845148, 0.704534, 0.414568, 0.0]

# Qwen-Image 2.1 + the lightx2v Lightning LoRA (4-step DMD distillation; ~5s per image at 1024x1024, no CFG). Same server as
# qwen-image-2.1-Q6_K_XL, so other 2.1 LoRAs can be added to `lora`.
# Save the LoRA as pytorch_lora_weights.safetensors in the LoRA folder. The sigmas are the card's 4-step schedule after the
# resolution-dependent exponential shift, worked out for 1024x1024. For other sizes drop custom_sigmas and use sample_steps: 4
# (sd.cpp's own schedule; in a 16-image test it was a bit less reliable on text).
# https://huggingface.co/lightx2v/Qwen-Image-2.1-Lightning
- name: qwen-image-2.1-Q6_K_XL-Lightning
  server_args:
    --diffusion-model: /home/shared/ai/diffusion/gguf/qwen-image-2.1-Q6_K_XL.gguf
    --llm: /home/shared/ai/text_encoders/Qwen3-VL-8B-Instruct-UD-Q4_K_XL.gguf
    --vae: /home/shared/ai/vae/qwen_image_2.1_vae_bf16.safetensors
  generation_options:
    lora: [{path: pytorch_lora_weights.safetensors, multiplier: 1.0}]
    sample_params:
      sample_method: euler
      guidance: {txt_cfg: 1.0}
      custom_sigmas: [1.0, 0.857, 0.667, 0.4, 0.0]

# --vae must be the native/ComfyUI-split-format file (qwen_image_vae.safetensors) - the
# diffusers-format VAE also in vae/ (Qwen2.5-VL-7B-Instruct-diffusion_pytorch_model.safetensors)
# uses a different tensor naming convention and fails to load. Needs ref_images: [...] in the
# prompt options since this is an image-editing model, not txt2img.
- name: Qwen-Image-Edit-2509-Q3_K_M
  server_args:
    --diffusion-model: /home/shared/ai/diffusion/gguf/Qwen-Image-Edit-2509-Q3_K_M.gguf
    --llm: /home/shared/ai/text_encoders/Qwen2.5-VL-7B-Instruct-Q4_K_M.gguf
    --llm_vision: /home/shared/ai/text_encoders/Qwen2.5-VL-7B-Instruct-mmproj-F16.gguf
    --vae: /home/shared/ai/vae/qwen_image_vae.safetensors
  generation_options:
    sample_params: {sample_steps: 20, guidance: {txt_cfg: 2.5}}

# Qwen-Image-Edit-2511 (successor to 2509: better identity/multi-person consistency, less drift). Same encoder, vision file and VAE as
# 2509, same cfg 2.5 / 20 steps as the sd.cpp docs example. qwen_image_zero_cond_t=true is required (without it edit quality degrades).
# Needs ref_images: [...].
# https://huggingface.co/unsloth/Qwen-Image-Edit-2511-GGUF
- name: Qwen-Image-Edit-2511-Q4_K_M
  server_args:
    --diffusion-model: /home/shared/ai/diffusion/gguf/qwen-image-edit-2511-Q4_K_M.gguf
