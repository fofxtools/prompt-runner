# Juggernaut XL v9 Lightning (single-file checkpoint, VAE and text encoders included).
# Model card: DPM++ SDE Karras, 5-7 steps, CFG 1.5-2.0, at least 1024x1024. sd.cpp has no plain DPM++ SDE;
# dpm++2m_sde needs the karras scheduler (without it the images are full of colored noise).
# https://huggingface.co/RunDiffusion/Juggernaut-XL-Lightning
- name: Juggernaut_RunDiffusionPhoto2_Lightning_4Steps
