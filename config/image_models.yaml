  generation_options:
    cfg_scale: 1.0
    sample_steps: 25

# offload_params_to_cpu is required, not optional: text encoder (7.1GB) +
# diffusion model (9.3GB) exceeds a 16GB card's VRAM regardless of image
# resolution. vae_path must be the native/ComfyUI-split-format file
# (qwen_image_vae.safetensors) - the diffusers-format VAE also in vae/
# (Qwen2.5-VL-7B-Instruct-diffusion_pytorch_model.safetensors) uses a
# different tensor naming convention and fails to load. Needs ref_images=[...]
# in generate_image() since this is an image-editing model, not txt2img.
- name: Qwen-Image-Edit-2509-Q3_K_M
  init_options:
    diffusion_model_path: /home/shared/ai/diffusion/gguf/Qwen-Image-Edit-2509-Q3_K_M.gguf
    llm_path: /home/shared/ai/text_encoders/Qwen2.5-VL-7B-Instruct-Q4_K_M.gguf
    llm_vision_path: /home/shared/ai/text_encoders/Qwen2.5-VL-7B-Instruct-mmproj-F16.gguf
    vae_path: /home/shared/ai/vae/qwen_image_vae.safetensors
    offload_params_to_cpu: true
  generation_options:
    cfg_scale: 2.5
    sample_steps: 20

