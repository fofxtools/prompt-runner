    --diffusion-model: /home/shared/ai/diffusion/gguf/qwen-image-2.1-Q4_K_M.gguf
    --llm: /home/shared/ai/text_encoders/Qwen3-VL-8B-Instruct-UD-Q4_K_XL.gguf
    --vae: /home/shared/ai/vae/qwen_image_2.1_vae_bf16.safetensors
    --max-vram: 10
  generation_options:
    sample_params: {sample_steps: 25, guidance: {txt_cfg: 4.0}}

# --vae must be the native/ComfyUI-split-format file (qwen_image_vae.safetensors) - the
# diffusers-format VAE also in vae/ (Qwen2.5-VL-7B-Instruct-diffusion_pytorch_model.safetensors)
# uses a different tensor naming convention and fails to load. Needs ref_images: [...] in the
# prompt options since this is an image-editing model, not txt2img.
- name: Qwen-Image-Edit-2509-Q3_K_M
  server_args:
    --diffusion-model: /home/shared/ai/diffusion/gguf/Qwen-Image-Edit-2509-Q3_K_M.gguf
    --llm: /home/shared/ai/text_encoders/Qwen2.5-VL-7B-Instruct-Q4_K_M.gguf
    --llm_vision: /home/shared/ai/text_encoders/Qwen2.5-VL-7B-Instruct-mmproj-F16.gguf
    --vae: /home/shared/ai/vae/qwen_image_vae.safetensors
  generation_options:
    sample_params: {sample_steps: 20, guidance: {txt_cfg: 2.5}}

