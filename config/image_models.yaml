# Image generation models configuration
# One sd-server (stable-diffusion.cpp) is started per model.
#
# server_args: literal sd-server flags for this model, merged over image_server_args in config.yaml.
#   true gives a bare flag, false/null omits it, anything else gives `flag value`.
#   - Paths: --diffusion-model (or --model for all-in-one checkpoints), --llm, --llm_vision,
#     --clip_l, --clip_g, --t5xxl, --vae
#   - --max-vram 10 on the Klein and Qwen-Image 2.1 entries: caps VRAM so large images (1536x1536) don't OOM, at some speed cost on
#     small ones. Left off elsewhere, where sd.cpp's default auto-fit is faster (FLUX.2 dev is ~2.5x slower with it).
#   - A model's value wins over image_server_args; `false` drops a global flag (e.g. --sage-attn: false)
#
# generation_options: native sd-server request fields, merged (recursively) between
#   image_generation_defaults in config.yaml and each prompt's options.
#   - width, height, sample_params: {sample_steps, guidance: {txt_cfg}}, lora: [{path, multiplier}], etc.
#   - See stable-diffusion.cpp/examples/server/api.md

