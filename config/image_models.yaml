# Image generation models configuration
# Each model specifies the diffusion model and required text encoders/VAE
#
# init_options: Initialization parameters for StableDiffusion.__init__()
#   - Paths: diffusion_model_path, model_path, clip_l_path, t5xxl_path, vae_path, etc.
#   - Init flags: keep_clip_on_cpu, vae_decode_only, etc.
#
# generation_options: Default generation parameters for this model
#   - cfg_scale, sample_steps, width, height, etc.
#   - These are merged with global defaults and prompt options

