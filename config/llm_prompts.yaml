# Each prompt must have:
# - id: lowercase alphanumeric + underscore only
# - prompt: string or block (sent as one user message)
# - options: optional request fields for llama-server (temperature, max_tokens, seed, ...), over the model's
# - images: optional, with a prompt: a list of image files sent with it, before the text (the model needs an --mmproj).
#   With messages, a user message has its own images list. The log records the paths, not the images.
#   PNG, JPEG, GIF, BMP and WebP work, TIFF does not. Paths are used as written (relative ones from where you run).
#   Example:
#     - id: caption_fox
#       prompt: Write a long descriptive caption for this image in a formal tone.
#       images: [/home/shared/ai/tmp/images/fox.png]

# --- Single-message prompts ---

- id: little_red_riding_hood
  prompt: Write a modern version of Little Red Riding Hood.

- id: adventure_story
  prompt: |
    Create a scene-by-scene outline for a story about a boy's quest to retrieve a magical artifact.
    
    It should follow him into middle age and fatherhood, and include romance and adventure.

- id: electromagnetism
  prompt: Explain electromagnetism to a high schooler.

# --- Prompts with messages (system, user and assistant turns) ---

- id: helpful_storyteller_chat
  messages:
    - role: system
      content: You are a helpful and imaginative storyteller.
    - role: user
      content: Write a short original fairy tale set in a modern city.

- id: science_tutor_chat
  messages:
    - role: system
      content: You are a friendly science tutor who explains concepts clearly and simply.
    - role: user
      content: Explain how gravity works in a way a curious 12-year-old would understand.