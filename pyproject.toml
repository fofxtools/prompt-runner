[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-runner"
version = "0.2.3"
description = "LLM evaluation toolkit for running prompts across multiple models"
requires-python = ">=3.10"
dependencies = [
    "ollama",
    "pyyaml",
]

[project.optional-dependencies]
sheets = [
    "pillow",
]
dev = [
    "pillow",
    "black",
    "build",
    "mypy",
    "pytest",
    "ruff",
    "twine",
    "types-PyYAML",
    "gguf",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prompt_runner = ["py.typed"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
